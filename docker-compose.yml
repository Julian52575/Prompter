# Dev stack: one container running the Vite dev server for frontend/.
#
#   http://localhost:5173/   -> Prompt Builder with hot reload
#
# The shipped app is a single static HTML file (`just build` writes
# frontend/dist/index.html); no server runs in production.
#
# The source is bind-mounted; node_modules lives in a named volume so the
# host's copy never shadows the image's. After changing package.json or
# Dev.Dockerfile, run `just rebuild frontend`. Every volume is named: an
# anonymous one escapes the project's cleanup.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dev.Dockerfile
    volumes:
      - ./frontend:/app:z
      - frontend-node-modules:/app/node_modules
    # 127.0.0.1 only: without an address, Docker and Podman publish on every interface.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-5173}:5173"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))\""]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s

volumes:
  frontend-node-modules:
